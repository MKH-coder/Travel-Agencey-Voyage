<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Voyage Tours and Travels • More Destinations. Greater Stories.</title>
    <link rel="icon" type="image/jpeg" href="/voyage-logo.jpg" />
    <link rel="apple-touch-icon" href="/voyage-logo.jpg" />
    <script>
      // Suppress benign Vite HMR / WebSocket connection errors in sandbox
      window.addEventListener('error', function (event) {
        var msg = (event && (event.message || (event.error && (event.error.message || event.error.stack)))) || '';
        var src = (event && event.filename) || '';
        if (
          typeof msg === 'string' && (
            msg.toLowerCase().includes('websocket') ||
            msg.toLowerCase().includes('vite') ||
            msg.toLowerCase().includes('hmr') ||
            msg.includes('createWebSocketModuleRunnerTransport') ||
            src.includes('@vite/client')
          )
        ) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.stack || reason.message || reason)) || '';
        if (
          typeof msg === 'string' && (
            msg.toLowerCase().includes('websocket') ||
            msg.toLowerCase().includes('vite') ||
            msg.toLowerCase().includes('hmr') ||
            msg.includes('createWebSocketModuleRunnerTransport')
          )
        ) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return true;
        }
      });

      // Ensure GitHub Pages sub-path always ends with a slash so relative ./assets/ work properly
      if (
        window.location.hostname.includes('github.io') &&
        window.location.pathname.length > 1 &&
        !window.location.pathname.endsWith('/') &&
        !window.location.pathname.split('/').pop().includes('.')
      ) {
        window.location.replace(
          window.location.pathname + '/' + window.location.search + window.location.hash
        );
      }
    </script>
    <meta name="description" content="Voyage Tours and Travels - More Destinations. Greater Stories. Hand-curated luxury stays, international expedition packages, and seamless reservations." />
    <meta property="og:title" content="Voyage Tours and Travels • More Destinations. Greater Stories." />
    <meta property="og:description" content="Voyage Tours and Travels - More Destinations. Greater Stories. Hand-curated luxury stays, international expedition packages, and seamless reservations." />
    <meta property="og:image" content="/voyage-logo.jpg" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  </head>
