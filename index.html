<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Travel Platform</title>
    <script>
      // Ensure GitHub Pages sub-path always ends with a slash so relative ./assets/ work properly
      if (
        window.location.pathname.length > 1 &&
        !window.location.pathname.endsWith('/') &&
        !window.location.pathname.split('/').pop().includes('.')
      ) {
        window.location.replace(
          window.location.pathname + '/' + window.location.search + window.location.hash
        );
      }
    </script>
    <meta name="description" content="Full-stack travel platform with multi-theme engine, destination & hotel explorer, content submission workflow, and tiered admin portal with 2FA and audit logs." />
    <meta property="og:title" content="Travel Platform" />
    <meta property="og:description" content="Full-stack travel platform with multi-theme engine, destination & hotel explorer, content submission workflow, and tiered admin portal with 2FA and audit logs." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body class="bg-slate-950 text-slate-100 overflow-x-hidden w-full max-w-full m-0 p-0">
    <div id="root" class="overflow-x-hidden w-full max-w-full min-h-screen"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
